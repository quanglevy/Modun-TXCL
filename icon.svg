<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="url(#cyanGrad)" stroke-width="8"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(0, 242, 254, 0.2)" stroke-width="4" stroke-dasharray="10 15"/>

  <!-- AI Brain / Circuit Lines -->
  <g filter="url(#glow)">
    <!-- Circuit lines -->
    <path d="M140 256 H190 M322 256 H372 M256 140 V190 M256 322 V372" stroke="url(#cyanGrad)" stroke-width="8" stroke-linecap="round"/>
    <path d="M170 170 L205 205 M342 170 L307 205 M170 342 L205 307 M342 342 L307 307" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Central Hexagon Base -->
    <polygon points="256,160 340,208 340,304 256,352 172,304 172,208" fill="rgba(0, 242, 254, 0.12)" stroke="url(#cyanGrad)" stroke-width="8"/>
    
    <!-- Core Golden Crown & AI Text -->
    <polygon points="256,180 320,217 320,295 256,332 192,295 192,217" fill="rgba(245, 158, 11, 0.18)" stroke="url(#goldGrad)" stroke-width="5"/>
  </g>

  <!-- Node Circles -->
  <circle cx="140" cy="256" r="14" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="372" cy="256" r="14" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="256" cy="140" r="14" fill="#fbbf24" filter="url(#glow)"/>
  <circle cx="256" cy="372" r="14" fill="#fbbf24" filter="url(#glow)"/>
  <circle cx="170" cy="170" r="10" fill="#00f2fe"/>
  <circle cx="342" cy="170" r="10" fill="#00f2fe"/>
  <circle cx="170" cy="342" r="10" fill="#fbbf24"/>
  <circle cx="342" cy="342" r="10" fill="#fbbf24"/>

  <!-- Centered Typography "5D AI" -->
  <text x="256" y="250" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#00f2fe" text-anchor="middle" letter-spacing="2">5D VIP</text>
  <text x="256" y="295" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#fbbf24" text-anchor="middle" letter-spacing="4">AI PRO</text>
</svg>
